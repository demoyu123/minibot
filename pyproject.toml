[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minibot"
version = "0.1.0"
description = "A tiny teaching-first ReAct agent with tools, memory, and RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minibot = "minibot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["minibot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
